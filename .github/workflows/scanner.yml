name: scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ignition-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Restore recent alert state
        uses: actions/cache/restore@v4
        with:
          path: .scanner_state/
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-

      - name: Scan all active USDT Spot pairs
        id: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save alert state
        if: success() && steps.scan.outputs.cache_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .scanner_state/
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
